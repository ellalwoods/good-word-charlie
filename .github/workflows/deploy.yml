name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Publishes the built site to the gh-pages branch, which GitHub Pages serves.
permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Logic tests plus the checks on every word; a bad batch stops the deploy.
      - run: npm test
      - run: npm run build
      - name: Publish to gh-pages
        run: |
          cd dist
          touch .nojekyll
          git init -q -b gh-pages
          git add -A
          git -c user.name=github-actions -c user.email=github-actions@users.noreply.github.com commit -qm "Deploy $GITHUB_SHA"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" gh-pages
